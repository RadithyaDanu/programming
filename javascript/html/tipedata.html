<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<script>
    //string
document.writeln("hello world");
document.writeln("<br>");
document.writeln("hello world 2");
document.writeln("<br>");
document.writeln("hello world 3" + "hello world 4"); 

    //boolean
document.writeln("<br>");
document.writeln(true);
document.writeln("<br>");
document.writeln(false);

    //number
document.writeln("<br>");
document.writeln(1000);
document.writeln("<br>");
document.writeln(1000.11);
document.writeln("<br>");
document.writeln(1000 + 1000);
document.writeln("<br>");
document.writeln(0b1111); // ini biner
document.writeln("<br>");
document.writeln(0o17); // ini octal
document.writeln("<br>");

</script>

</body>
</html>
